name: Validate agent infrastructure
on:
  pull_request:
    paths:
      - '.github/agent/**'
      - '.github/workflows/issue-agent.yml'
      - '.github/workflows/agent-validation.yml'
      - 'AGENTS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test .github/agent/control.test.mjs
      - name: Validate workflow syntax and expressions
        run: docker run --rm --network none -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build test environment without API secrets
        timeout-minutes: 15
        run: node .github/agent/control.mjs prepare
      - name: Run actual Microgames checks inside sandbox
        timeout-minutes: 6
        run: node .github/agent/control.mjs verify-sandbox
      - name: Cleanup
        if: always()
        run: node .github/agent/control.mjs cleanup
