version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: microgames-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      DB_CONNECTION: mongodb
      DB_HOST: mongo
      DB_PORT: 27017
      DB_DATABASE: microgames
      DB_USERNAME: admin
      DB_PASSWORD: password
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      - mongo
    networks:
      - microgames

  nginx:
    image: nginx:alpine
    container_name: microgames-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - microgames
  vite:
    image: node:20
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev"]


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microgames-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - microgames

  mongo:
    image: mongo:6
    container_name: microgames-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: microgames
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - microgames

networks:
  microgames:
    driver: bridge

volumes:
  mongo_data: